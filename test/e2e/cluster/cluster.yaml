# The e2e's Management cluster: a k0smotron control plane on kine (PostgreSQL in a
# container on the kind network), on CAPD machines. Every machine is controller and
# worker, without konnectivity: CAPD's load balancer forwards only the API port.
# The encryption config's Secret comes from beforeApply (../encryption.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: mgmt
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: mgmt
  namespace: mgmt
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.244.0.0/16"]
    services:
      cidrBlocks: ["10.96.0.0/12"]
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: DockerCluster
    name: mgmt
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: K0sControlPlane
    name: mgmt
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerCluster
metadata:
  name: mgmt
  namespace: mgmt
spec:
  loadBalancer:
    customHAProxyConfigTemplateRef:
      name: mgmt-haproxy
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerMachineTemplate
metadata:
  name: mgmt-cp
  namespace: mgmt
spec:
  template:
    spec:
      # Only the OS image: k0smotron installs k0s on it.
      customImage: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
      # CAPD in the cluster itself, after the pivot, creates machines through the
      # host's Docker.
      extraMounts:
        - containerPath: /var/run/docker.sock
          hostPath: /var/run/docker.sock
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: K0sControlPlane
metadata:
  name: mgmt
  namespace: mgmt
spec:
  replicas: 1
  version: v1.36.5+k0s.0
  k0sConfigSpec:
    args:
      - --enable-worker
      - --no-taints
      # As the first user runs it: every node is a controller in the pod network, so the
      # API servers reach pods directly. CAPD's load balancer forwards only 6443, so
      # konnectivity agents could never reach their server through it anyway, and every
      # webhook call failed with "No agent available" (the first proof run).
      - --disable-components=konnectivity-server
    files:
      - path: /etc/k0s/encryption-config.yaml
        permissions: "0644"
        contentFrom:
          secretRef:
            name: mgmt-bootstrap
            key: encryption-config.yaml
    k0s:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: k0s
      spec:
        api:
          extraArgs:
            anonymous-auth: "true"
            encryption-provider-config: /etc/k0s/encryption-config.yaml
        storage:
          type: kine
          kine:
            dataSource: postgres://kine:kine-e2e@selfhostctl-e2e-db:5432/kine?sslmode=disable
        network:
          podCIDR: 10.244.0.0/16
          serviceCIDR: 10.96.0.0/12
          controlPlaneLoadBalancing:
            enabled: false
        telemetry:
          enabled: false
        # Flux, as the first user installs it: flux-operator and a FluxInstance that
        # syncs the e2e's git server. It can't fetch until selfhostctl's gitops phase
        # writes the flux-git Secret.
        extensions:
          helm:
            charts:
              - name: flux-operator
                chartname: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
                version: "0.62.1"
                namespace: flux-system
                order: 1
              - name: flux-instance
                chartname: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
                version: "0.62.1"
                namespace: flux-system
                order: 2
                values: |
                  instance:
                    distribution:
                      version: "2.x"
                    cluster:
                      networkPolicy: false
                    sync:
                      kind: GitRepository
                      url: ssh://git@selfhostctl-e2e-git/srv/fleet.git
                      ref: refs/heads/main
                      path: clusters/mgmt
                      pullSecret: flux-git
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: DockerMachineTemplate
        name: mgmt-cp
---
# CAPD's load balancer, health-checking k0s's API servers over TLS (k0smotron's own
# CAPD e2e template).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mgmt-haproxy
  namespace: mgmt
  labels:
    clusterctl.cluster.x-k8s.io/move: ""
data:
  value: |
    global
      log /dev/log local0
      log /dev/log local1 notice
      daemon
      maxconn 100000

    resolvers docker
      nameserver dns 127.0.0.11:53

    defaults
      log global
      mode tcp
      option dontlognull
      timeout connect 5000
      timeout client 50000
      timeout server 50000
      default-server init-addr none

    frontend stats
      mode http
      bind *:8404
      stats enable
      stats uri /stats
      stats refresh 1s
      stats admin if TRUE

    frontend control-plane
      bind *:{{ .FrontendControlPlanePort }}
      {{ if .IPv6 -}}
      bind :::{{ .FrontendControlPlanePort }};
      {{- end }}
      default_backend kube-apiservers

    backend kube-apiservers
      default-server inter 2s fall 2 rise 3
      timeout connect 2s
      timeout server 5s
      retries 3
      option redispatch
      option httpchk GET /healthz
      {{range $server, $backend := .BackendServers}}
      server {{ $server }} {{ JoinHostPort $backend.Address $.BackendControlPlanePort }} weight {{ $backend.Weight }} check check-ssl verify none resolvers docker resolve-prefer {{ if $.IPv6 -}} ipv6 {{- else -}} ipv4 {{- end }}
      {{- end}}

