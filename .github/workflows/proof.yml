name: Proof

# The PRD's first proof step (#1), throwaway: proof/proof.sh on a GitHub-hosted runner.
# Lives on the proof branch only.
on:
  push:
    branches: ["proof/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The Bootstrap cluster: kind, or one k0s container (the #3 discussion).
        bootstrap: [kind, k0s]
    name: proof (${{ matrix.bootstrap }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSLo "$HOME/bin/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSLo "$HOME/bin/clusterctl" https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.4/clusterctl-linux-amd64
          curl -fsSLo "$HOME/bin/kubectl" https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
          chmod +x "$HOME"/bin/*
          echo "$HOME/bin" >>"$GITHUB_PATH"
      # kind's known-issues values: with kind, k0s machines and break-glass side by side,
      # the runner's defaults ran out ("too many open files", the second proof run).
      - name: inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=524288
          sudo sysctl -w fs.inotify.max_user_instances=512
      - run: docker info --format '{{.MemTotal}} bytes, {{.NCPU}} CPUs, cgroup {{.CgroupVersion}}'
      - name: Proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ matrix.bootstrap }}
        run: proof/proof.sh all
      - name: Dump
        if: failure()
        env:
          BOOTSTRAP: ${{ matrix.bootstrap }}
        run: proof/proof.sh dump
