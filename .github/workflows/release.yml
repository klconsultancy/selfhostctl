name: Release

# release-please keeps a release pull request open with the next version and its
# changelog, from the Conventional Commits titles on main. Merging it tags the
# release, which builds the binaries and adds them, with their checksums, to the
# GitHub release.
#
# A release candidate is a tag such as v1.2.3-rc.1 on main, pushed by an admin (the
# "release tags" ruleset): it builds the binaries the same way, as a pre-release, so
# they can be tested before the release pull request is merged.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions: {}

jobs:
  # release-please itself, as the GitHub App, in the shared workflow. It checks a release
  # candidate's tag (release_candidate) but creates no pre-release (create-prerelease is
  # off): that is created below, once the build has succeeded, with what it built.
  release-please:
    name: Release
    permissions: {} # it acts as the app
    uses: klconsultancy/workflows/.github/workflows/release-please.yml@e6939b6be36b833baf87de0ce25c0ff4cac96b2f # v1.0.0
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  binaries:
    needs: release-please
    # always(): on a release candidate's tag, release-please's job is skipped. A tag is
    # built only when the call checked it as a release candidate of the pending release.
    if: always() && (needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.release_candidate == 'true')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    permissions:
      contents: write # the GitHub release
      id-token: write # signing the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No module or build cache for a release: a cache written by another workflow
          # run (a pull request's, say) must not end up in the binaries.
          cache: false
      - run: scripts/build.sh "$TAG"
      # A signed build provenance attestation of each binary, checked with
      # `gh attestation verify`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          create-storage-record: false
      # release-please made the release; a release candidate gets a pre-release here.
      - name: Add the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          header="Verify a binary with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`, or its checksum against \`checksums.txt\`."
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --generate-notes --notes "$header"
          else
            changelog=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$header

          $changelog"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*
