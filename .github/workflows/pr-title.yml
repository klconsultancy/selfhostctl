name: PR title

# The title becomes the squash commit on main, from which release-please derives the next
# version and the changelog. The check is the shared one in klconsultancy/workflows; it
# runs on pull_request, not pull_request_target, which GitHub blocks by default in public
# repositories.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: PR title
    permissions:
      pull-requests: read
    uses: klconsultancy/workflows/.github/workflows/pr-title.yml@78f13c92a7d630ff602a5497ed6bbe6e68e2dd0e # main
